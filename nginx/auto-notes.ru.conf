server {
    listen 80;
    server_name auto-notes.ru www.auto-notes.ru;

    root /var/www/auto-notes.ru/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
